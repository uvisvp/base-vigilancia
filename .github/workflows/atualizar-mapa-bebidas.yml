name: Atualizar MAPA - Vinhos e Bebidas

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: write

concurrency:
  group: atualizar-mapa-bebidas
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: python -m pip install --upgrade requests

      - name: Gerar base MAPA - Vinhos e Bebidas
        run: python scripts/gerar_mapa_bebidas.py

      - name: Validar arquivos gerados
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          base = Path("dados/mapa/bebidas")
          obrigatorios = [
              base / "manifest.json",
              base / "schema.json",
              base / "fonte.sha256",
          ]

          if not base.exists():
              raise SystemExit("ERRO: pasta dados/mapa/bebidas não existe.")

          for p in obrigatorios:
              if not p.exists():
                  raise SystemExit(f"ERRO: arquivo obrigatório ausente: {p}")

          manifest = json.loads((base / "manifest.json").read_text(encoding="utf-8"))
          schema = json.loads((base / "schema.json").read_text(encoding="utf-8"))

          total = int(manifest.get("quantidade_registros", 0))
          if total <= 0:
              raise SystemExit("ERRO: manifest informa zero registros.")

          if manifest.get("versao_schema") != "1.2.0":
              raise SystemExit(
                  f"ERRO: schema inesperado: {manifest.get('versao_schema')}"
              )

          if manifest.get("identificador_principal") != "numero_registro_mapa":
              raise SystemExit("ERRO: identificador principal incorreto.")

          if manifest.get("consulta_exata_por_cnpj") is not False:
              raise SystemExit("ERRO: a base não pode declarar consulta exata por CNPJ.")

          if schema.get("indice_cnpj") is not False:
              raise SystemExit("ERRO: schema não pode declarar índice CNPJ.")

          # Não pode existir índice CNPJ residual da versão anterior.
          indice_cnpj = base / "indice_cnpj.json"
          if indice_cnpj.exists():
              raise SystemExit(
                  "ERRO: indice_cnpj.json residual encontrado; fonte fornece CPF/CNPJ mascarado."
              )

          # Valida todos os JSONs.
          for jf in base.rglob("*.json"):
              try:
                  json.loads(jf.read_text(encoding="utf-8"))
              except Exception as e:
                  raise SystemExit(f"ERRO: JSON inválido em {jf}: {e}")

          # Fragmentos
          fragmentos = manifest.get("fragmentacao", {}).get("fragmentos", [])
          if not fragmentos:
              raise SystemExit("ERRO: manifest não contém fragmentacao.fragmentos.")

          soma = 0
          for frag in fragmentos:
              arquivo = frag.get("arquivo")
              quantidade = frag.get("quantidade")
              if not arquivo or quantidade is None:
                  raise SystemExit(f"ERRO: fragmento inválido: {frag}")

              caminho = base / arquivo
              if not caminho.exists():
                  raise SystemExit(f"ERRO: fragmento ausente: {caminho}")

              dados = json.loads(caminho.read_text(encoding="utf-8"))
              if not isinstance(dados, list):
                  raise SystemExit(f"ERRO: fragmento não é lista: {caminho}")

              real = len(dados)
              if real != int(quantidade):
                  raise SystemExit(
                      f"ERRO: {caminho}: declarado={quantidade}, real={real}"
                  )
              soma += real

          if soma != total:
              raise SystemExit(
                  f"ERRO: soma dos fragmentos ({soma}) difere do manifest ({total})."
              )

          indices_esperados = [
              "indice_registro.json",
              "indice_nome.json",
              "indice_municipio_uf.json",
              "indice_classificacao.json",
              "indice_area_atuacao.json",
              "indice_situacao.json",
              "indice_atividade.json",
          ]

          for nome in indices_esperados:
              p = base / nome
              if not p.exists():
                  raise SystemExit(f"ERRO: índice esperado ausente: {p}")
              obj = json.loads(p.read_text(encoding="utf-8"))
              if not isinstance(obj, dict):
                  raise SystemExit(f"ERRO: índice não é objeto JSON: {p}")

          # Teste estrutural de pelo menos um registro.
          primeiro_frag = base / fragmentos[0]["arquivo"]
          dados = json.loads(primeiro_frag.read_text(encoding="utf-8"))
          if not dados:
              raise SystemExit("ERRO: primeiro fragmento vazio.")

          reg = dados[0]
          campos_necessarios = [
              "cpf_cnpj_original",
              "cpf_cnpj_parcial_norm",
              "razao_social",
              "municipio",
              "uf",
              "numero_registro_mapa",
              "situacao",
              "area_atuacao",
              "atividade",
              "classificacao",
              "origem",
          ]
          faltantes = [c for c in campos_necessarios if c not in reg]
          if faltantes:
              raise SystemExit(
                  "ERRO: registro sem campos obrigatórios: " + ", ".join(faltantes)
              )

          print(f"OK: {total} registros.")
          print(f"OK: {len(fragmentos)} fragmentos; soma={soma}.")
          print("OK: identificador principal = numero_registro_mapa.")
          print("OK: índice exato por CNPJ desativado.")
          print("OK: JSONs, fragmentos e índices validados.")
          PY

      - name: Verificar alterações da base
        id: changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- dados/mapa/bebidas)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Há alterações na base MAPA Bebidas."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Sem alterações na base MAPA Bebidas."
          fi

      - name: Publicar atualização
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dados/mapa/bebidas
          git commit -m "Atualiza base MAPA de Vinhos e Bebidas"
          git push
