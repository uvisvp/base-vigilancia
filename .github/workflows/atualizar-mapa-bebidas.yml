name: Atualizar MAPA - Vinhos e Bebidas

on:
  workflow_dispatch:
  schedule:
    # Segunda-feira, 06:00 BRT = 09:00 UTC
    - cron: "0 9 * * 1"

permissions:
  contents: write

concurrency:
  group: atualizar-mapa-bebidas
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Gerar base MAPA - Vinhos e Bebidas
        run: |
          python scripts/gerar_mapa_bebidas.py

      - name: Validar arquivos gerados
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          base = Path("dados/mapa/bebidas")

          if not base.exists():
              raise SystemExit("ERRO: pasta dados/mapa/bebidas não foi criada.")

          obrigatorios = [
              base / "manifest.json",
              base / "schema.json",
              base / "fonte.sha256",
          ]

          for p in obrigatorios:
              if not p.exists():
                  raise SystemExit(f"ERRO: arquivo obrigatório ausente: {p}")

          manifest = json.loads((base / "manifest.json").read_text(encoding="utf-8"))

          qtd = int(manifest.get("quantidade_registros", 0))
          if qtd <= 0:
              raise SystemExit("ERRO: quantidade_registros inválida.")

          for p in base.rglob("*.json"):
              json.loads(p.read_text(encoding="utf-8"))

          lotes = manifest.get("fragmentacao", {}).get("arquivos", [])
          soma = 0

          for item in lotes:
              arq = base / item["arquivo"]
              if not arq.exists():
                  raise SystemExit(f"ERRO: fragmento ausente: {arq}")
              dados = json.loads(arq.read_text(encoding="utf-8"))
              soma += len(dados)

          if soma != qtd:
              raise SystemExit(
                  f"ERRO: soma dos fragmentos ({soma}) difere do manifest ({qtd})."
              )

          print(f"OK: {qtd} registros; {len(lotes)} fragmentos; JSONs válidos.")
          PY

      - name: Verificar alterações
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- dados/mapa/bebidas && \
             git diff --cached --quiet -- dados/mapa/bebidas && \
             [ -z "$(git status --porcelain --untracked-files=all dados/mapa/bebidas)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma alteração real na base."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Alterações detectadas na base."
          fi

      - name: Commitar atualização
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dados/mapa/bebidas

          git commit -m "Atualiza base MAPA de Vinhos e Bebidas"
          git push
