name: Atualizar legislação adicional

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/atualizar_legislacao_adicional.py"
      - ".github/workflows/atualizar-legislacao-adicional.yml"

permissions:
  contents: write

concurrency:
  group: legislacao-adicional
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar somente os arquivos necessários
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/atualizar-legislacao-adicional.yml
            scripts/
            textos/
            dados/legislacao_v12/
            fontes/normas.csv
            fontes/rdc-anvisa-22-2014/
            fontes/decreto-estadual-sp-69118-2024/
            fontes/lei-municipal-sp-13478-2002/
            fontes/lei-federal-10357-2001/
            fontes/lei-estadual-sp-15266-2013/
            fontes/rdc-anvisa-359-2020/
            fontes/rdc-anvisa-361-2020/
            fontes/rdc-anvisa-57-2009/

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install --quiet requests beautifulsoup4 pypdf

      - name: Verificar estruturador
        run: python scripts/estruturar_legislacao.py --autoteste

      - name: Atualizar normas adicionais
        run: python scripts/atualizar_legislacao_adicional.py

      - name: Resumo
        if: always()
        run: |
          if [ -f dados/legislacao_v12/relatorio-legislacao-adicional.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat dados/legislacao_v12/relatorio-legislacao-adicional.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar arquivos gerados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fontes/normas.csv \
                  fontes/rdc-anvisa-22-2014 \
                  fontes/decreto-estadual-sp-69118-2024 \
                  fontes/lei-municipal-sp-13478-2002 \
                  fontes/lei-federal-10357-2001 \
                  fontes/lei-estadual-sp-15266-2013 \
                  fontes/rdc-anvisa-359-2020 \
                  fontes/rdc-anvisa-361-2020 \
                  fontes/rdc-anvisa-57-2009 \
                  textos/ \
                  dados/legislacao_v12/
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
          else
            git commit -m "Atualiza legislação adicional no v12"
            for tentativa in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push concorrente detectado; sincronizando (tentativa ${tentativa}/3)."
              git fetch origin main
              git rebase origin/main
            done
            git push origin HEAD:main
          fi
