name: Atualizar Produtos de Cannabis

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * 2"

permissions:
  contents: write

concurrency:
  group: atualizar-cannabis
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar base de Cannabis
        run: python scripts/gerar_cannabis.py

      - name: Verificar alterações
        id: changes
        run: |
          git add dados/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Salvar atualização
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/
          git commit -m "Atualiza produtos de Cannabis"
          git pull --rebase origin main
          git push origin HEAD:main
