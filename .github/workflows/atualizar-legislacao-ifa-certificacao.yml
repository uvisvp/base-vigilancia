name: Atualizar legislação IFA certificação

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/atualizar_legislacao_ifa_certificacao.py"
      - ".github/workflows/atualizar-legislacao-ifa-certificacao.yml"

permissions:
  contents: write

concurrency:
  group: legislacao-ifa-certificacao
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar arquivos necessários
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/atualizar-legislacao-ifa-certificacao.yml
            scripts/
            textos/
            dados/legislacao_v12/
            fontes/normas.csv
            fontes/rdc-anvisa-362-2020/
            fontes/rdc-anvisa-497-2021/
            fontes/rdc-anvisa-672-2022/

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install --quiet requests beautifulsoup4 pypdf fonttools

      - name: Verificar estruturador
        run: python scripts/estruturar_legislacao.py --autoteste

      - name: Atualizar normas de certificação de IFA
        run: python scripts/atualizar_legislacao_ifa_certificacao.py

      - name: Resumo
        if: always()
        run: |
          if [ -f dados/legislacao_v12/relatorio-legislacao-ifa-certificacao.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat dados/legislacao_v12/relatorio-legislacao-ifa-certificacao.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar arquivos gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fontes/normas.csv \
                  fontes/rdc-anvisa-362-2020 \
                  fontes/rdc-anvisa-497-2021 \
                  fontes/rdc-anvisa-672-2022 \
                  textos/ \
                  dados/legislacao_v12/
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
            exit 0
          fi
          git commit -m "Atualiza normas de certificação de IFA no v12"
          for tentativa in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push concorrente detectado; sincronizando (tentativa ${tentativa}/3)."
            git fetch origin main
            git rebase origin/main
          done
          git push origin HEAD:main
