name: Atualizar IN 75/2020 completa

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/baixar_in75_2020.py'
      - 'scripts/estruturar_legislacao.py'
      - 'dados/legislacao_curada/in-75-2020-anexo-xv.json'
      - '.github/workflows/atualizar-in75.yml'
  schedule:
    - cron: '30 9 * * 1'

permissions:
  contents: write

concurrency:
  group: atualizar-manifesto-regulatorio
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Autoteste do estruturador
        run: python scripts/estruturar_legislacao.py --autoteste
      - name: Baixar IN 75/2020 oficial completa
        run: python scripts/baixar_in75_2020.py
      - name: Estruturar legislação
        run: python scripts/estruturar_legislacao.py
      - name: Validar conteúdo estruturado
        run: |
          python - <<'PY'
          import json, pathlib, re

          p=pathlib.Path('dados/legislacao_v12/normas/in-75-2020.json')
          fonte=pathlib.Path('textos/IN 75-2020--anvisa-legis.txt')
          curado=pathlib.Path('dados/legislacao_curada/in-75-2020-anexo-xv.json')
          if not p.exists():
              raise SystemExit('Arquivo estruturado da IN 75/2020 não foi gerado')
          if not fonte.exists():
              raise SystemExit('Texto oficial da IN 75/2020 não foi preservado')
          if not curado.exists():
              raise SystemExit('Anexo XV curado não foi preservado')

          d=json.loads(p.read_text(encoding='utf-8'))
          texto_fonte=fonte.read_text(encoding='utf-8')
          nos=d.get('nos',[])
          anexos_nos=[n for n in nos if n.get('tipo')=='anexo']
          anexos={n.get('anexo') for n in anexos_nos}
          esp={'I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI','XXII','XXIII'}
          falta=esp-anexos
          extra=anexos-esp
          if falta:
              raise SystemExit('Anexos não estruturados: '+', '.join(sorted(falta)))
          if extra:
              raise SystemExit('Anexos inesperados: '+', '.join(sorted(extra)))
          if len(anexos_nos) != 23:
              raise SystemExit(f'Quantidade de nós de anexo incorreta: {len(anexos_nos)}')

          ids_estruturais=[n.get('id') for n in nos if n.get('estrutural',True)]
          if len(ids_estruturais) != len(set(ids_estruturais)):
              vistos=set(); repetidos=[]
              for x in ids_estruturais:
                  if x in vistos and x not in repetidos:
                      repetidos.append(x)
                  vistos.add(x)
              raise SystemExit('IDs estruturais repetidos: '+str(repetidos[:10]))
          rep=d.get('validacao',{}).get('ids_estruturais_repetidos',[])
          if rep:
              raise SystemExit('Validação interna reporta IDs estruturais repetidos: '+str(rep[:10]))

          tabelas=[n for n in nos if n.get('tipo')=='tabela']
          linhas=[n for n in nos if n.get('tipo')=='linha_tabela']
          artigos=[n for n in nos if n.get('tipo')=='artigo']
          itens=[n for n in nos if n.get('tipo')=='item']
          tabelas_fonte=texto_fonte.count('[[TABELA_INICIO]]')
          if tabelas_fonte == 0:
              raise SystemExit('Fonte oficial sem marcadores de tabela preservados')
          tabelas_html=[n for n in tabelas if n.get('origem_estrutura')=='html_oficial']
          if len(tabelas_html) != tabelas_fonte:
              raise SystemExit(f'Paridade de tabelas falhou: fonte={tabelas_fonte}, JSON={len(tabelas_html)}')
          pais_tabela={n.get('id') for n in tabelas}
          orfas=[n for n in linhas if n.get('origem_estrutura')=='html_oficial' and n.get('pai') not in pais_tabela]
          if orfas:
              raise SystemExit('Células HTML sem tabela-pai: '+str([n.get('id') for n in orfas[:10]]))

          textos_linhas={n.get('texto') for n in linhas}
          artigos_em_tabela=[a for a in artigos if a.get('texto') in textos_linhas]
          if artigos_em_tabela:
              raise SystemExit('Artigo duplicado como linha de tabela: '+str([a.get('id') for a in artigos_em_tabela[:10]]))

          # Valores nutricionais não podem virar números de dispositivos jurídicos.
          padrao_valor=re.compile(r'^\s*(?:2\.000(?:\s*kcal)?|600\s*mg|300\s*mg|15\s*g|7,5\s*g|6\s*g|3\s*g)\b', re.I)
          tipos_dispositivo={'artigo','paragrafo','inciso','item'}
          falsos=[n for n in nos if n.get('tipo') in tipos_dispositivo and padrao_valor.search(n.get('texto',''))]
          if falsos:
              raise SystemExit('Valor nutricional convertido em dispositivo: '+str([(n.get('id'),n.get('texto')) for n in falsos[:10]]))
          valores_encontrados=[n for n in nos if padrao_valor.search(n.get('texto',''))]
          print('VALORES NUTRICIONAIS AMOSTRADOS:', [(n.get('anexo'),n.get('tipo'),n.get('texto')) for n in valores_encontrados[:20]])

          # Confere os dez anexos indicados para amostragem operacional e mostra conteúdo real das tabelas.
          criticos=('II','IV','V','VIII','IX','XV','XX','XXI','XXII','XXIII')
          for alvo in criticos:
              raiz=[n for n in anexos_nos if n.get('anexo')==alvo]
              if len(raiz)!=1:
                  raise SystemExit(f'ANEXO {alvo}: esperado 1 nó raiz, encontrado {len(raiz)}')
              if not raiz[0].get('texto'):
                  raise SystemExit(f'ANEXO {alvo}: título vazio')
              filhos=[n for n in nos if n.get('anexo')==alvo and n.get('tipo')!='anexo']
              if not filhos:
                  raise SystemExit(f'ANEXO {alvo}: sem conteúdo estruturado')
              tipos={}
              for n in filhos:
                  tipos[n.get('tipo')]=tipos.get(n.get('tipo'),0)+1
              amostra=[n.get('texto') for n in filhos if n.get('tipo')=='linha_tabela' and n.get('texto')][:5]
              print(f"ANEXO {alvo}: título={raiz[0].get('texto','')!r}; nós={len(filhos)}; tipos={tipos}; amostra_tabela={amostra}")

          # O Anexo XV operacional curado é complementar e deve manter exatamente os três limites aprovados.
          c=json.loads(curado.read_text(encoding='utf-8')).get('registros',[])
          if len(c)!=3:
              raise SystemExit(f'Anexo XV curado: esperado 3 registros, encontrado {len(c)}')
          esperado={
              'acucares-adicionados':(15,'g/100g',7.5,'g/100ml'),
              'gorduras-saturadas':(6,'g/100g',3,'g/100ml'),
              'sodio':(600,'mg/100g',300,'mg/100ml'),
          }
          por_numero={r.get('numero'):r for r in c}
          if set(por_numero)!=set(esperado):
              raise SystemExit('Anexo XV curado: registros inesperados ou ausentes: '+str(sorted(por_numero)))
          for numero,(vs,us,vl,ul) in esperado.items():
              r=por_numero[numero]
              s=r.get('solidos_semissolidos',{}); l=r.get('liquidos',{})
              if (s.get('operador'),s.get('valor'),s.get('unidade')) != ('>=',vs,us):
                  raise SystemExit(f'Anexo XV curado inválido em {numero}/sólidos: {s}')
              if (l.get('operador'),l.get('valor'),l.get('unidade')) != ('>=',vl,ul):
                  raise SystemExit(f'Anexo XV curado inválido em {numero}/líquidos: {l}')
              if not r.get('fonte_oficial'):
                  raise SystemExit(f'Anexo XV curado sem fonte oficial: {numero}')
          print('ANEXO XV CURADO OK:', sorted(por_numero))

          print(f'TOTAL: nós={len(nos)}; anexos={len(anexos_nos)}; tabelas_fonte={tabelas_fonte}; tabelas_json={len(tabelas)}; linhas_tabela={len(linhas)}; artigos={len(artigos)}; itens={len(itens)}')
          print('OK: 23 anexos, IDs únicos, tabelas preservadas, anexos críticos amostrados, valores nutricionais protegidos e Anexo XV curado íntegro')
          PY
      - name: Atualizar manifesto regulatório
        run: python scripts/gerar_manifesto_regulatorio.py
      - name: Commit se houver alterações
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for tentativa in 1 2 3; do
            echo "Tentativa $tentativa de 3"
            git fetch origin main

            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo 'main mudou durante a execução; regenerando sobre a versão mais recente'
              git reset --hard origin/main
              python scripts/estruturar_legislacao.py --autoteste
              python scripts/baixar_in75_2020.py
              python scripts/estruturar_legislacao.py
              python scripts/gerar_manifesto_regulatorio.py
            fi

            git add textos/ dados/legislacao_v12/ dados/regulatorio/
            if git diff --cached --quiet; then
              echo 'Sem alterações após sincronização.'
              exit 0
            fi

            git commit -m 'Atualiza IN 75/2020 e manifesto regulatório'
            if git push origin HEAD:main; then
              echo 'IN 75/2020 atualizada com sucesso.'
              exit 0
            fi
          done

          echo 'Falha após 3 tentativas por concorrência de commits.'
          exit 1
