name: Atualizar base da Anvisa

on:
  workflow_dispatch:

  schedule:
    # Segunda-feira às 06:00 no horário de Brasília
    # GitHub Actions usa UTC: 06:00 BRT = 09:00 UTC
    - cron: "0 9 * * 1"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar base
        run: python scripts/gerar_base.py

      - name: Verificar alterações
        id: changes
        run: |
          git add dados/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Salvar atualização
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/
          git commit -m "Atualiza base da Vigilância"
          git push
