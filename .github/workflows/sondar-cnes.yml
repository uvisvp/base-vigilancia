name: Sondar fontes do CNES

# Teste na branch de desenvolvimento: gera a base do CNES com a base mensal real
# e grava o resultado na própria branch, para conferência antes do merge.
on:
  push:
    branches: [claude/manipulacao-tablet-blocos-czcgtx]
    paths: [.github/workflows/sondar-cnes.yml, scripts/gerar_cnes.py]

permissions:
  contents: write

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar base do CNES
        run: python scripts/gerar_cnes.py
      - name: Gravar na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cnes dados/manifest.json
          git commit -m "Teste: base do CNES gerada na branch" && git push origin HEAD:${GITHUB_REF_NAME}
