name: Atualizar banco CADIFA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/atualizar_cadifa.py"
      - "scripts/diagnosticar_ifa_regularidade.py"
      - ".github/workflows/atualizar-cadifa.yml"
  schedule:
    - cron: "45 9 * * 1"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extrair CADIFA
        run: python scripts/atualizar_cadifa.py

      - name: Validar saída
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('dados/ifa_regularidade/cadifa.json').read_text(encoding='utf-8'))
          assert d['schema']=='cadifa-v1'
          assert d['total']>0
          assert len(d['registros'])==d['total']
          assert d['mapa_campos']['ifa']=='NO_INSUMO_MINUSC'
          assert d['mapa_campos']['detentor']=='NO_RAZAO_SOCIAL_MAISC'
          assert d['mapa_campos']['processo']=='NU_PROCESSO'
          assert d['mapa_campos']['situacao']=='DS_SITUACAO_APRESENTACAO'
          print('CADIFA:', d['total'], 'registros')
          print('Mapa:', d['mapa_campos'])
          PY

      - name: Publicar banco no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/ifa_regularidade/cadifa.json dados/ifa_regularidade/cadifa-descoberta.json dados/ifa_regularidade/manifest.json
          if git diff --cached --quiet; then
            echo "Sem alterações."
          else
            git commit -m "Atualiza banco CADIFA"
            for tentativa in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push concorrente detectado; sincronizando (tentativa ${tentativa}/3)."
              git fetch origin main
              git rebase origin/main
            done
            git push origin HEAD:main
          fi
