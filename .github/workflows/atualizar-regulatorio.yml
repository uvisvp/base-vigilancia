name: Atualizar manifesto regulatório

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/estruturar_legislacao.py"
      - "scripts/gerar_manifesto_regulatorio.py"
      - "dados/legislacao_curada/**"
      - "dados/controlados_portaria344/**"
  schedule:
    - cron: "40 9 * * 1"

permissions:
  contents: write

concurrency:
  group: atualizar-manifesto-regulatorio
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Autoteste da estrutura legislativa
        run: python scripts/estruturar_legislacao.py --autoteste

      - name: Gerar legislação hierárquica
        run: python scripts/estruturar_legislacao.py

      - name: Gerar manifesto regulatório
        run: python scripts/gerar_manifesto_regulatorio.py

      - name: Validar manifesto
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('dados/regulatorio/manifest.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['schema']=='manifesto-regulatorio-v1'
          for k in ('in75_anexo_xv','regularizacao_cosmeticos','regularizacao_saneantes'):
              assert d['bases'][k]['status']=='ok', (k,d['bases'][k])
          print('Manifesto regulatório válido:', d['status'])
          print('Faltantes:', d.get('faltantes', []))
          PY

      - name: Verificar alterações
        id: changes
        run: |
          git add dados/legislacao_v12/ dados/regulatorio/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Salvar atualização sem conflito concorrente
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for tentativa in 1 2 3; do
            echo "Tentativa $tentativa de 3"
            git fetch origin main

            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "main mudou durante a execução; regenerando sobre a versão mais recente"
              git reset --hard origin/main
              python scripts/estruturar_legislacao.py --autoteste
              python scripts/estruturar_legislacao.py
              python scripts/gerar_manifesto_regulatorio.py
            fi

            git add dados/legislacao_v12/ dados/regulatorio/
            if git diff --cached --quiet; then
              echo "Nenhuma alteração pendente após sincronização."
              exit 0
            fi

            git commit -m "Atualiza banco regulatório estruturado"
            if git push origin HEAD:main; then
              echo "Atualização regulatória salva com sucesso."
              exit 0
            fi

            echo "Outro commit chegou antes do push; nova tentativa será feita."
          done

          echo "Falha após 3 tentativas por concorrência de commits."
          exit 1
