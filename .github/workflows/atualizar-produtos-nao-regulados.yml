name: Atualizar produtos não regularizados como dispositivos médicos

on:
  workflow_dispatch:
  # Lista da Anvisa de produtos não regularizados como dispositivos médicos (página gov.br),
  # revista pela Anvisa sem data fixa: conferida todo mês.
  schedule:
    - cron: "15 11 5 * *"

permissions:
  contents: write

concurrency:
  group: atualizar-produtos-nao-regulados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar lista de produtos não regularizados
        run: python scripts/gerar_produtos_nao_regulados.py

      - name: Verificar alterações
        id: changes
        run: |
          git add dados/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Salvar atualização
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/
          git commit -m "Atualiza produtos não regularizados como dispositivos médicos"
          git pull --rebase origin main
          git push origin HEAD:main
