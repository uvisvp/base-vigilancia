name: Atualizar produtos por processo - temporario

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atualizar-processos-produtos-temporario.yml'

permissions:
  contents: write

jobs:
  atualizar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Atualizar todas as bases
        run: |
          python scripts/gerar_base.py
          python scripts/gerar_suplementos_constituintes.py
          python scripts/gerar_bases_por_processo.py
      - name: Validar saneante informado e cobertura sem registro
        run: |
          python <<'PY'
          import json, re
          from pathlib import Path
          alvo='25351239002201018'
          shard=alvo[5:8]
          p=Path('dados/saneantes_processos')/(shard+'.json')
          assert p.exists(), p
          data=json.loads(p.read_text(encoding='utf-8'))
          hits=[x for x in data if re.sub(r'\D','',str(x.get('processo','')))==alvo]
          assert hits, 'processo alvo ausente da visão de saneantes'
          assert any('HTH LIMPA BORDAS' in str(x.get('produto','')).upper() for x in hits), hits[:3]
          manifest=json.loads(Path('dados/manifest.json').read_text(encoding='utf-8'))
          san=manifest['bases']['saneantes_processos']
          med=manifest['bases']['medicamentos_processos']
          assert san['processos_sem_registro'] > 100000, san
          assert med['processos_sem_registro'] > 0, med
          print('TESTE SANEANTE OK:', hits[0])
          print('SANEANTES SEM REGISTRO:', san['processos_sem_registro'])
          print('MEDICAMENTOS SEM REGISTRO:', med['processos_sem_registro'])
          PY
      - name: Publicar dados validados e limpar diagnostico temporario
        run: |
          rm -f scripts/diagnosticar_processos_produtos.py
          rm -f .github/workflows/diagnosticar-processos-produtos-temporario.yml
          rm -f .github/workflows/atualizar-processos-produtos-temporario.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A dados/ scripts/ .github/workflows/
          git diff --cached --check
          git commit -m 'Atualiza bases e inclui saneantes e medicamentos por processo'
          git pull --rebase origin main
          git push origin HEAD:main
